version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: platform-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-1-Desk}
      POSTGRES_USER: ${POSTGRES_USER:-chatuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatpass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d 1-Desk"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: platform-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    networks: [internal]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: platform-backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-chatuser}:${POSTGRES_PASSWORD:-chatpass}@postgres:5432/${POSTGRES_DB:-1-Desk}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-changeme_min_64_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-changeme_refresh_min_64_chars}
      PORT: 4000
      BASE_URL: ${BASE_URL:-http://localhost:4000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-development}
      UPLOAD_DIR: /app/media
      INTEGRATION_ENC_KEY: ${INTEGRATION_ENC_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - platform_media:/app/media
    networks: [internal]
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: platform-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
      VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:4000}
    depends_on: [backend]
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks: [internal, proxy]
    command: npm run dev

volumes:
  postgres_data: {}
  platform_media: {}

networks:
  internal:
    name: platform_internal
  proxy:
    external: true
